services:
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "1025:1025"
      - "8025:8025"

  mysql:
    image: mysql:8.4
    profiles: ["mysql"]
    environment:
      MYSQL_ROOT_PASSWORD: mastermeister5
      MYSQL_DATABASE: mastermeister5_target
    ports:
      - "3306:3306"
    volumes:
      - ./initdb/mysql-mariadb:/docker-entrypoint-initdb.d:ro

  mariadb:
    image: mariadb:11.4
    profiles: ["mariadb"]
    environment:
      MARIADB_ROOT_PASSWORD: mastermeister5
      MARIADB_DATABASE: mastermeister5_target
    ports:
      - "3307:3306"
    volumes:
      - ./initdb/mysql-mariadb:/docker-entrypoint-initdb.d:ro

  postgres:
    image: postgres:17
    profiles: ["postgres"]
    environment:
      POSTGRES_PASSWORD: mastermeister5
      POSTGRES_DB: mastermeister5_target
    ports:
      - "5432:5432"
    volumes:
      - ./initdb/postgres:/docker-entrypoint-initdb.d:ro
